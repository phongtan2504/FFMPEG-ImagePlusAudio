name: 3. Ghep Audio Va Video Nen (Tao Video Youtube)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Dán URL Video nền (Catbox.moe)'
        required: true
        type: string
      audio_url:
        description: 'Dán URL File Audio (Catbox.moe)'
        required: true
        type: string
      bg_volume:
        description: 'Âm lượng video nền'
        required: true
        default: '0'
        type: string
      audio_speed:
        description: 'Tốc độ Audio đọc'
        required: true
        default: '1.0'
        type: choice
        options:
          - '0.75'
          - '1.0'
          - '1.25'
      output_name:
        description: 'Tên file video đầu ra (không ghi .mp4)'
        required: true
        default: 'video_youtube_final'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download input files
        run: |
          curl -L "${{ github.event.inputs.video_url }}" -o input_video.mp4
          curl -L "${{ github.event.inputs.audio_url }}" -o input_audio.mp3

      - name: Process Audio Speed and Merge Video
        run: |
          # Tính toán bộ lọc tốc độ âm thanh (atempo)
          SPEED="${{ github.event.inputs.audio_speed }}"
          
          # Đổi tốc độ file audio sang file audio_speed.mp3
          ffmpeg -i input_audio.mp3 -filter:a "atempo=${SPEED}" audio_speed.mp3 -y

          # Ghép audio đã đổi tốc độ vào video nền
          BG_VOL="${{ github.event.inputs.bg_volume }}"
          OUT_NAME="${{ github.event.inputs.output_name }}.mp4"

          if [ "$BG_VOL" -eq "0" ]; then
            ffmpeg -i input_video.mp4 -i audio_speed.mp3 -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 -shortest "$OUT_NAME" -y
          else
            ffmpeg -i input_video.mp4 -i audio_speed.mp3 -filter_complex "[0:a]volume=${BG_VOL}[a0];[1:a]volume=1.0[a1];[a0][a1]amix=inputs=2:duration=first[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -shortest "$OUT_NAME" -y
          fi
