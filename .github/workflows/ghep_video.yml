name: "3. Ghep Audio Va Video Nen (Tao Video Youtube)"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Dán URL Video nền (Catbox.moe)"
        required: true
        default: ""
        type: string
      audio_url:
        description: "Dán URL File Audio (Catbox.moe)"
        required: true
        default: ""
        type: string
      bg_volume:
        description: "Âm lượng video nền"
        required: true
        default: "0 (Tắt hoàn toàn tiếng video nền)"
        type: choice
        options:
          - "0 (Tắt hoàn toàn tiếng video nền)"
          - "0.1 (Giảm còn 10% - Rất nhỏ)"
          - "0.2 (Giảm còn 20% - Vừa phải)"
          - "0.5 (Giảm còn 50% - Nửa âm lượng)"
      output_name:
        description: "Tên file video đầu ra (không ghi .mp4)"
        required: true
        default: "video_youtube_final"
        type: string

jobs:
  merge_media:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt FFmpeg và Curl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg curl

      - name: Tải Video nền và Audio từ URL
        run: |
          echo "Đang tải Video nền..."
          curl -L "${{ github.event.inputs.video_url }}" -o bg_video.mp4

          echo "Đang tải Audio..."
          curl -L "${{ github.event.inputs.audio_url }}" -o bg_audio.mp3

      - name: Ghép Audio và Chỉnh Âm Lượng Video Nền
        run: |
          VOL_CHOICE="${{ github.event.inputs.bg_volume }}"
          VOL=$(echo $VOL_CHOICE | awk '{print $1}')

          # Đo chính xác thời lượng (giây) của file audio
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 bg_audio.mp3)
          echo "Độ dài audio chính: $DURATION giây"

          if [ "$VOL" == "0" ]; then
            # Tắt tiếng video nền và cắt video chuẩn theo độ dài audio chính (-t $DURATION)
            ffmpeg -stream_loop -1 -i bg_video.mp4 -i bg_audio.mp3 \
              -t $DURATION \
              -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 output.mp4
          else
            # Giảm âm lượng video nền và cắt chuẩn theo độ dài audio chính
            ffmpeg -stream_loop -1 -i bg_video.mp4 -i bg_audio.mp3 \
              -t $DURATION \
              -filter_complex "[0:a]volume=$VOL[bg_sound];[1:a][bg_sound]amix=inputs=2:duration=first[a_out]" \
              -map 0:v:0 -map "[a_out]" -c:v copy -c:a aac output.mp4
          fi

      - name: Tải Video về (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: output.mp4
