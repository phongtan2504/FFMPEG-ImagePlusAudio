name: "3. Ghep Audio Va Video Nen (Tao Video Youtube)"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Dán URL Video nền (Catbox.moe)"
        required: true
        default: ""
        type: string
      audio_url:
        description: "Dán URL File Audio (Catbox.moe)"
        required: true
        default: ""
        type: string
      output_name:
        description: "Tên file video đầu ra (không ghi .mp4)"
        required: true
        default: "video_youtube_final"
        type: string

jobs:
  merge_media:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt FFmpeg và Curl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg curl

      - name: Tải Video nền và Audio từ URL
        run: |
          echo "Đang tải Video nền..."
          curl -L "${{ github.event.inputs.video_url }}" -o bg_video.mp4

          echo "Đang tải Audio..."
          curl -L "${{ github.event.inputs.audio_url }}" -o bg_audio.mp3

      - name: Ghép Audio vào Video (Tự động lặp video nếu audio dài hơn)
        run: |
          ffmpeg -stream_loop -1 -i bg_video.mp4 -i bg_audio.mp3 -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 -shortest output.mp4

      - name: Tải Video về (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: output.mp4
