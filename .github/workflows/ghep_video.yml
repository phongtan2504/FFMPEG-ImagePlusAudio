name: "3. Ghep Audio Va Video Nen (Tao Video Youtube)"

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Dán URL Video nền (Catbox.moe)"
        required: true
        default: ""
        type: string
      audio_url:
        description: "Dán URL File Audio (Catbox.moe)"
        required: true
        default: ""
        type: string
      audio_speed:
        description: "Chọn tốc độ đọc / phát Audio"
        required: true
        default: "1.0 (Bình thường - 1.0x)"
        type: choice
        options:
          - "0.75 (Chậm - 0.75x)"
          - "1.0 (Bình thường - 1.0x)"
          - "1.25 (Nhanh - 1.25x)"
      bg_volume:
        description: "Âm lượng video nền"
        required: true
        default: "0 (Tắt hoàn toàn tiếng video nền)"
        type: choice
        options:
          - "0 (Tắt hoàn toàn tiếng video nền)"
          - "0.1 (Giảm còn 10% - Rất nhỏ)"
          - "0.2 (Giảm còn 20% - Vừa phải)"
          - "0.5 (Giảm còn 50% - Nửa âm lượng)"
      output_name:
        description: "Tên file video đầu ra (không ghi .mp4)"
        required: true
        default: "video_youtube_final"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt FFmpeg và Curl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg curl python3

      - name: Tải Video nền và Audio từ URL
        env:
          RAW_VIDEO_URL: "${{ github.event.inputs.video_url }}"
          RAW_AUDIO_URL: "${{ github.event.inputs.audio_url }}"
        run: |
          python3 -c '
          import os, sys, subprocess

          def clean_url(url):
              url = url.strip()
              if url and not url.startswith(("http://", "https://")):
                  url = "https://" + url
              return url

          v_url = clean_url(os.environ.get("RAW_VIDEO_URL", ""))
          a_url = clean_url(os.environ.get("RAW_AUDIO_URL", ""))

          if not v_url:
              print("LỖI: Chưa dán link Video nền!")
              sys.exit(1)

          if not a_url:
              print("LỖI: Chưa dán link Audio!")
              sys.exit(1)

          print(f"Đang tải Video nền từ: {v_url}")
          res_v = subprocess.run(["curl", "-sL", v_url, "-o", "bg_video.mp4"])
          if res_v.returncode != 0 or not os.path.exists("bg_video.mp4") or os.path.getsize("bg_video.mp4") == 0:
              print("LỖI: Link Video nền không tải được! Vui lòng kiểm tra lại link Catbox.")
              sys.exit(1)

          print(f"Đang tải Audio từ: {a_url}")
          res_a = subprocess.run(["curl", "-sL", a_url, "-o", "bg_audio.mp3"])
          if res_a.returncode != 0 or not os.path.exists("bg_audio.mp3") or os.path.getsize("bg_audio.mp3") == 0:
              print("LỖI: Link Audio không tải được! Vui lòng kiểm tra lại link Catbox.")
              sys.exit(1)

          print("Tải thành công cả 2 file!")
          '

      - name: Điều chỉnh tốc độ Audio
        run: |
          SPD_CHOICE="${{ github.event.inputs.audio_speed }}"
          SPD=$(echo $SPD_CHOICE | awk '{print $1}')

          echo "Đang chỉnh tốc độ Audio sang ${SPD}x..."
          if [ "$SPD" == "1.0" ]; then
            cp bg_audio.mp3 bg_audio_ready.mp3
          else
            ffmpeg -y -i bg_audio.mp3 -filter:a "atempo=$SPD" bg_audio_ready.mp3
          fi

      - name: Ghép Audio và Chỉnh Âm Lượng Video Nền
        run: |
          VOL_CHOICE="${{ github.event.inputs.bg_volume }}"
          VOL=$(echo $VOL_CHOICE | awk '{print $1}')

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 bg_audio_ready.mp3)
          echo "Độ dài audio sau khi đổi tốc độ: $DURATION giây"

          if [ "$VOL" == "0" ]; then
            ffmpeg -y -stream_loop -1 -i bg_video.mp4 -i bg_audio_ready.mp3 \
              -t $DURATION \
              -c:v copy -c:a aac -map 0:v:0 -map 1:a:0 output.mp4
          else
            ffmpeg -y -stream_loop -1 -i bg_video.mp4 -i bg_audio_ready.mp3 \
              -t $DURATION \
              -filter_complex "[0:a]volume=$VOL[bg_sound];[1:a][bg_sound]amix=inputs=2:duration=first[a_out]" \
              -map 0:v:0 -map "[a_out]" -c:v copy -c:a aac output.mp4
          fi

      - name: Tải Video về (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: output.mp4
          if-no-files-found: error
